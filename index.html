<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varnek</title>
<meta name="description" content="Varnek, a dark medieval fantasy survival action RPG for Android.">
<style>
  :root {
    --bg: #0e0b09;
    --line: #2c231b;
    --text: #e6ddd3;
    --muted: #a3968a;
    --bronze: #c08a4a;
    --ember: #e0662a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
  h1 {
    margin: 0 0 8px;
    font-size: 3rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--bronze);
  }
  .tag { margin: 0 0 40px; color: var(--muted); }
  section { border-top: 1px solid var(--line); padding: 24px 0; }
  h2 {
    margin: 0 0 8px;
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ember);
  }
  p { margin: 0; }
  a { color: var(--bronze); }
  footer {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>Varnek</h1>
  <p class="tag">A dark medieval fantasy survival action RPG for Android.</p>

  <section>
    <h2>Privacy Policy</h2>
    <p><a href="https://sites.google.com/view/varnekprivacypolicy/startseite">Read the privacy policy</a></p>
  </section>

  <section>
    <h2>Contact</h2>
    <p><a href="mailto:kroveone@gmail.com">kroveone@gmail.com</a></p>
  </section>

  <footer>&copy; 2026 Emre Eroglu</footer>
</main>
</body>
</html>
